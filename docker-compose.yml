version: '3.8'

# MinIO = local S3 for uploads (resumes, application PDFs, profile photos).
#   docker compose up -d minio minio-setup
# Console: http://localhost:9001  (nextgig / nextgig-secret)
# .env: UPLOADS_DISK=s3 plus the AWS_* values from .env.example.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - AWS_ENDPOINT=http://minio:9000
    depends_on:
      - minio

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    ports:
      - "3306:3306"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nextgig
      MINIO_ROOT_PASSWORD: nextgig-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the private bucket once MinIO is up, then exits.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nextgig nextgig-secret &&
      mc mb --ignore-existing local/nextgig &&
      mc anonymous set none local/nextgig
      "

volumes:
  minio-data:
